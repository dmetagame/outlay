[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true
show_metrics = true

# Explicitly opt into RPC-dependent tests; default tests never silently skip them.
[profile.robinhood]
test = "fork-test"

[fmt]
line_length = 110
